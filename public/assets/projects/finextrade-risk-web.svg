<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131D33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Top Header -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="70" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="30" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">
      FINEXTRADE: RISK ARCHITECTURE &amp; CAPITAL PRESERVATION
    </text>
    <text x="30" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">
      Arsitektur Perlindungan Modal Bertingkat, Persistent Circuit Breaker &amp; Fail-Closed News Shield
    </text>

    <!-- Badges on right -->
    <rect x="850" y="20" width="120" height="30" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="910" y="39" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">PYTEST 38 PASS</text>

    <rect x="985" y="20" width="110" height="30" rx="8" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444"/>
    <text x="1040" y="39" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#F87171" text-anchor="middle">FAIL-CLOSED</text>
  </g>

  <!-- 4 Big Metric Cards -->
  <g transform="translate(40, 120)">
    <!-- Card 1: Daily Circuit Breaker -->
    <g transform="translate(0, 0)">
      <rect width="265" height="135" rx="16" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FCD34D">CIRCUIT BREAKER (SQLITE)</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#FFFFFF">-0.8R <tspan font-size="14" fill="#64748B">/ -3.0R</tspan></text>
      <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">● STATUS: AKTIF (NORMAL)</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Tersimpan atomik di disk SQLite</text>
    </g>

    <!-- Card 2: Monotonic Profit Lock -->
    <g transform="translate(285, 0)">
      <rect width="265" height="135" rx="16" fill="url(#cardBg)" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#67E8F9">PROFIT LOCK GUARD</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#FFFFFF">+1.25R</text>
      <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">● NON-DECREASING LOCK</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Mengunci profit, tolak berbalik rugi</text>
    </g>

    <!-- Card 3: News Shield -->
    <g transform="translate(570, 0)">
      <rect width="265" height="135" rx="16" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#6EE7B7">NEWS SHIELD (HIGH-IMPACT)</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#10B981">SAFE WINDOW</text>
      <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">● HOLD ORDER: OFF</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Auto-hold saat NFP/CPI USD rilis</text>
    </g>

    <!-- Card 4: Real Account Guard -->
    <g transform="translate(855, 0)">
      <rect width="265" height="135" rx="16" fill="url(#cardBg)" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#FDA4AF">REAL ACCOUNT GUARD</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#F43F5E">LOCKED</text>
      <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FB7185">● ALLOW_LIVE_REAL=0</text>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Hard-block eksekusi dana riil di kode</text>
    </g>
  </g>

  <!-- Risk Mechanism Flowchart & Detail Panels -->
  <g transform="translate(40, 275)">
    <!-- Left Panel: 5-Tier Capital Defense Architecture -->
    <rect width="650" height="435" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
      5 LAPISAN PERLINDUNGAN RISIKO FINANSIAL
    </text>

    <!-- Defense 1 -->
    <g transform="translate(25, 50)">
      <rect width="600" height="65" rx="10" fill="#0A101D" stroke="#1E293B"/>
      <circle cx="25" cy="32" r="14" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="25" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#60A5FA" text-anchor="middle">L1</text>
      <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Dynamic Volatility Sizing (ATR &amp; Fixed Fractional Risk)</text>
      <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Ukuran lot dihitung proporsional terhadap jarak Stop Loss pips &amp; batas 1.0% saldo akun.</text>
    </g>

    <!-- Defense 2 -->
    <g transform="translate(25, 125)">
      <rect width="600" height="65" rx="10" fill="#0A101D" stroke="#1E293B"/>
      <circle cx="25" cy="32" r="14" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="25" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">L2</text>
      <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Persistent Daily Circuit Breaker (Max Loss -3.0R)</text>
      <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Penyimpanan status ke SQLite lokal atomik; tidak bisa di-reset dengan restart server.</text>
    </g>

    <!-- Defense 3 -->
    <g transform="translate(25, 200)">
      <rect width="600" height="65" rx="10" fill="#0A101D" stroke="#1E293B"/>
      <circle cx="25" cy="32" r="14" fill="#06B6D4" fill-opacity="0.2"/>
      <text x="25" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#22D3EE" text-anchor="middle">L3</text>
      <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Monotonic Profit Lock (Trailing Non-Decreasing)</text>
      <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Mengunci level Stop Loss berjenjang ke Break-Even (+0.2R) hingga +1.0R saat harga naik.</text>
    </g>

    <!-- Defense 4 -->
    <g transform="translate(25, 275)">
      <rect width="600" height="65" rx="10" fill="#0A101D" stroke="#1E293B"/>
      <circle cx="25" cy="32" r="14" fill="#10B981" fill-opacity="0.2"/>
      <text x="25" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">L4</text>
      <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">News Radar &amp; Spread Expansion Filter (Fail-Closed)</text>
      <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Blokir order 30 menit sebelum/sesudah berita USD berdampak tinggi; cek spread &lt; 2.5 pip.</text>
    </g>

    <!-- Defense 5 -->
    <g transform="translate(25, 350)">
      <rect width="600" height="65" rx="10" fill="#0A101D" stroke="#1E293B"/>
      <circle cx="25" cy="32" r="14" fill="#F43F5E" fill-opacity="0.2"/>
      <text x="25" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FB7185" text-anchor="middle">L5</text>
      <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Hard-Coded Environment Isolation &amp; Session Token</text>
      <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Autentikasi token acak kriptografis di tiap request API WebSocket &amp; pelindung akun real.</text>
    </g>
  </g>

