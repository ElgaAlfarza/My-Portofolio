<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#140b2e"/>
      <stop offset="100%" stop-color="#1f0a38"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231745" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#180e33" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="750" fill="url(#grid)"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <!-- Badge SINTA 4 -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">SINTA 4 ACCREDITED</text>

    <!-- Badge Accuracy -->
    <rect x="195" y="0" width="160" height="32" rx="16" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5"/>
    <text x="275" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">ACCURACY 94.6%</text>

    <!-- Title -->
    <text x="0" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      SASAK SCRIPT DEEP LEARNING CNN CLASSIFIER
    </text>
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#c084fc">
      Arsitektur Klasifikasi Naskah Kuno Lontar Sasak Berbasis VGG16 &amp; VGG19 Convolutional Neural Network
    </text>
  </g>

  <!-- Pipeline Diagram Layout -->
  <!-- STEP 1: INPUT CITRA LONTAR -->
  <g transform="translate(60, 190)">
    <rect width="190" height="340" rx="20" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="130" rx="12" fill="#0f0720" stroke="#7e22ce" stroke-width="1"/>
    
    <!-- Lontar Ancient Script Icon/Glyphs -->
    <text x="95" y="75" font-family="serif" font-size="42" font-weight="bold" fill="#facc15" text-anchor="middle" filter="url(#glow)">ᬅ ᬓ ᬱ</text>
    <text x="95" y="115" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Citra Daun Lontar</text>

    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">01. Citra Input</text>
    <text x="20" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• Resolusi 224x224 RGB</text>
    <text x="20" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• Daun Lontar Monyeh</text>
    <text x="20" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• 18 Aksara Utama</text>

    <!-- Pill tag -->
    <rect x="20" y="280" width="150" height="28" rx="8" fill="#581c87" fill-opacity="0.6"/>
    <text x="95" y="298" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">DATASET ASLI LOMBOK</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(260, 345)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#c084fc" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="30,-6 40,0 30,6" fill="#c084fc"/>
  </g>

  <!-- STEP 2: PREPROCESSING & THRESHOLD -->
  <g transform="translate(310, 190)">
    <rect width="190" height="340" rx="20" fill="url(#cardGrad)" stroke="#6b21a8" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="130" rx="12" fill="#0f0720" stroke="#7e22ce" stroke-width="1"/>
    
    <!-- Binary Filter Simulation -->
    <rect x="35" y="35" width="120" height="90" rx="6" fill="#000000" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 55 90 Q 75 45 95 90 T 135 90" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="95" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Otsu Binarization</text>

    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">02. Preprocessing</text>
    <text x="20" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• Grayscale Conversion</text>
    <text x="20" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• Gaussian Denoising</text>
    <text x="20" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a78bfa">• Bounding Box Crop</text>

    <!-- Pill tag -->
    <rect x="20" y="280" width="150" height="28" rx="8" fill="#0369a1" fill-opacity="0.4"/>
    <text x="95" y="298" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#7dd3fc" text-anchor="middle">OPENCV SEGMENTATION</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(510, 345)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#c084fc" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="30,-6 40,0 30,6" fill="#c084fc"/>
  </g>

  <!-- STEP 3: CNN FEATURE EXTRACTION (VGG16/VGG19) -->
  <g transform="translate(560, 190)">
    <rect width="260" height="340" rx="20" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <rect x="15" y="15" width="230" height="130" rx="12" fill="#0f0720" stroke="#a855f7" stroke-width="1"/>
    
    <!-- 3D CNN Blocks -->
    <g transform="translate(30, 35)">
      <!-- Block 1 -->
      <rect x="0" y="20" width="22" height="65" rx="3" fill="#8b5cf6"/>
      <rect x="26" y="20" width="22" height="65" rx="3" fill="#8b5cf6"/>
      <rect x="52" y="30" width="16" height="45" rx="3" fill="#3b82f6"/>

      <!-- Block 2 -->
      <rect x="74" y="25" width="20" height="55" rx="3" fill="#a855f7"/>
      <rect x="98" y="25" width="20" height="55" rx="3" fill="#a855f7"/>
      <rect x="122" y="35" width="16" height="35" rx="3" fill="#3b82f6"/>

      <!-- Block 3 -->
      <rect x="144" y="30" width="18" height="45" rx="3" fill="#d946ef"/>
      <rect x="166" y="30" width="18" height="45" rx="3" fill="#d946ef"/>
      <rect x="188" y="40" width="14" height="25" rx="3" fill="#3b82f6"/>
    </g>
    <text x="130" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f0abfc" text-anchor="middle">Conv2D (3x3) + MaxPool</text>

    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff">03. VGG16 / VGG19 CNN</text>
    <text x="20" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d8b4fe">• 13 - 16 Convolutional Layers</text>
    <text x="20" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d8b4fe">• Receptive Field Hierarki Goresan</text>
    <text x="20" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#d8b4fe">• Dense Layer (1024) + Dropout 0.5</text>

    <!-- Pill tag -->
    <rect x="20" y="280" width="220" height="28" rx="8" fill="url(#purpleGrad)"/>
    <text x="130" y="298" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="black" fill="#ffffff" text-anchor="middle">DEEP LEARNING MODEL</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(830, 345)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#c084fc" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="30,-6 40,0 30,6" fill="#c084fc"/>
  </g>

  <!-- STEP 4: SOFTMAX 18 CLASSES & ACCURACY -->
  <g transform="translate(880, 190)">
    <rect width="260" height="340" rx="20" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="230" height="130" rx="12" fill="#062217" stroke="#059669" stroke-width="1"/>
    
    <!-- Confidence Probability Bar Graph -->
    <g transform="translate(35, 30)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#6ee7b7">Aksara 'Ha'</text>
      <rect x="80" y="4" width="115" height="14" rx="3" fill="#10b981"/>
      <text x="180" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ffffff">98.2%</text>

      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a7f3d0">Aksara 'Na'</text>
      <rect x="80" y="29" width="15" height="14" rx="3" fill="#047857"/>
      <text x="105" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">1.2%</text>

      <text x="0" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a7f3d0">Aksara 'Ca'</text>
      <rect x="80" y="54" width="8" height="14" rx="3" fill="#047857"/>
      <text x="98" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">0.4%</text>

      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a7f3d0">Aksara 'Ra'</text>
      <rect x="80" y="79" width="4" height="14" rx="3" fill="#047857"/>
      <text x="94" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">0.2%</text>
    </g>

    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff">04. Softmax (18 Kelas)</text>
    <text x="20" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#6ee7b7">• Probabilitas Aksara Terpilih</text>
    <text x="20" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#6ee7b7">• Inferensi Cepat &lt;120ms</text>
    <text x="20" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#6ee7b7">• Output Streamlit GUI Interaktif</text>

    <!-- Pill tag -->
    <rect x="20" y="280" width="220" height="28" rx="8" fill="#047857"/>
    <text x="130" y="298" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="black" fill="#ffffff" text-anchor="middle">PREDIKSI TEPAT 94.6%</text>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(60, 570)">
    <rect width="1080" height="120" rx="16" fill="#130a2a" stroke="#4c1d95" stroke-width="1.5"/>
    
    <text x="30" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      Teknologi &amp; Metodologi Riset Ilmiah:
    </text>

    <!-- Tech Badges -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="65" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Python 3.10</text>

      <rect x="145" y="0" width="155" height="36" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="222" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">TensorFlow / Keras</text>

      <rect x="315" y="0" width="150" height="36" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="390" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">VGG16 &amp; VGG19</text>

      <rect x="480" y="0" width="130" height="36" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="545" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">OpenCV (cv2)</text>

      <rect x="625" y="0" width="140" height="36" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="695" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Streamlit Web</text>

      <rect x="780" y="0" width="240" height="36" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
      <text x="900" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="black" fill="#a7f3d0" text-anchor="middle">JURNAL SINTA 4 (2024)</text>
    </g>
  </g>
</svg>
