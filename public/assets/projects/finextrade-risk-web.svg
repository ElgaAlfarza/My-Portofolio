      <text x="270" y="60" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">+1.00R</text>
      <text x="340" y="60" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">TP HIT</text>

      <!-- Row 2 -->
      <text x="15" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">#890125</text>
      <text x="80" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#F43F5E">SELL</text>
      <text x="140" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">0.50</text>
      <text x="200" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">2686.20</text>
      <text x="270" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#F43F5E">-1.00R</text>
      <text x="340" y="95" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#F43F5E">SL HIT</text>

      <!-- Row 3 -->
      <text x="15" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">#890126</text>
      <text x="80" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">BUY</text>
      <text x="140" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">0.50</text>
      <text x="200" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">2682.10</text>
      <text x="270" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#06B6D4">+0.20R</text>
      <text x="340" y="130" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#06B6D4">PROFIT_LK</text>

      <!-- Row 4 -->
      <text x="15" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">#890127</text>
      <text x="80" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">BUY</text>
      <text x="140" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">0.50</text>
      <text x="200" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">2683.40</text>
      <text x="270" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">+1.00R</text>
      <text x="340" y="165" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">TP HIT</text>

      <!-- Row 5 Current Open -->
      <rect x="5" y="185" width="390" height="35" rx="6" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="15" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">#890128</text>
      <text x="80" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">BUY</text>
      <text x="140" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FFFFFF">0.50</text>
      <text x="200" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FFFFFF">2684.50</text>
      <text x="270" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">+0.45R</text>
      <text x="340" y="206" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FACC15">OPEN</text>

      <!-- Bottom SQLite Status -->
      <rect x="15" y="295" width="370" height="50" rx="8" fill="#0A101D" stroke="#1E293B"/>
      <text x="30" y="316" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FFFFFF">DATABASE: trades.db (SQLite3)</text>
